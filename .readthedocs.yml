version: 2

build:
  os: "ubuntu-26.04"
  tools:
    python: "miniforge3-latest"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
    pre_install:
      - git update-index --assume-unchanged .rtd-environment.yml docs/conf.py

conda:
  environment: .rtd-environment.yml

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false

formats: []

python:
  install:
    - method: pip
      extra_requirements:
        - all
        - docs
      path: .
