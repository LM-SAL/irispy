version: 2

build:
  os: "ubuntu-lts-latest"
  apt_packages:
    - ffmpeg
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # Exit code 183 cancels the build, matching the [ci skip] handling of GitHub Actions and CircleCI.
      - if git log -1 --pretty=%B | grep -qE '\[(ci skip|skip ci)\]'; then exit 183; fi
      - git fetch --unshallow || true
    pre_install:
      - git update-index --assume-unchanged docs/conf.py

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false

formats: []

python:
  install:
    - method: uv
      command: pip
      requirements: .rtd-requirements.txt
