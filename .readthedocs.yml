version: 2

build:
  os: "ubuntu-lts-latest"
  apt_packages:
    - ffmpeg
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
    pre_install:
      - git update-index --assume-unchanged docs/conf.py

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false

formats: []

python:
  install:
    - method: uv
      command: pip
      requirements: .rtd-requirements.txt
